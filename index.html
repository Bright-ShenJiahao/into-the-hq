<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<title>深入日军总部 Into the HQ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{position:fixed;inset:0;width:100%;height:100%;background:#0b0d0c;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#eee6d4;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#view{position:absolute;inset:0}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#1a2024}
button{font-family:inherit;cursor:pointer}
.btn{background:linear-gradient(#5a4a30,#3a2e1c);color:#ffe9b8;border:2px solid #b8955a;border-radius:8px;padding:10px 22px;font-size:18px;box-shadow:0 3px 0 #1e160a}
.btn:hover{filter:brightness(1.2)}.btn:disabled{filter:grayscale(1) brightness(.6);cursor:default}
.btn.ghost{background:rgba(0,0,0,.35);border-color:#7a6a4a;color:#cbbf9f}.btn.red{background:#7a2416}.btn.big{font-size:24px;padding:12px 40px}
/* 背景：雪原色块 */
.bg{position:absolute;inset:0;background:linear-gradient(#2a3540 0%,#3c4a55 55%,#cdd6dc 56%,#aab4bc 100%)}
.bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 75% 70% at 50% 52%,transparent 45%,rgba(5,8,12,.6))}
.bg.battle{background:#cfd6dc url(assets/bg/battle_snow.jpg) center 30%/cover no-repeat}
.bg.battle::after{background:linear-gradient(180deg,rgba(10,14,20,.25) 0%,rgba(10,14,20,0) 35%,rgba(10,14,20,.05) 60%,rgba(12,16,24,.55) 100%),radial-gradient(ellipse 80% 75% at 50% 45%,transparent 55%,rgba(5,8,12,.55))}
.tbg.pic{background:#1a2430 url(assets/bg/battle_snow.jpg) center/cover no-repeat}.tbg.pic::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,10,14,.75),rgba(8,10,14,.15) 60%,rgba(8,10,14,.35))}
.unit .spr.art{display:block;position:relative;z-index:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.sprw.hitf{animation:hitf .32s}@keyframes hitf{0%,100%{translate:0;filter:none}25%{translate:-8px 0;filter:brightness(1.8) sepia(.6) hue-rotate(-30deg)}70%{translate:6px 0}}
.bg.rest{background:linear-gradient(#1c1a14,#3a2a18)}.bg.ev{background:linear-gradient(#1a2430,#2e3c48)}
.tbg{position:absolute;inset:0;background:linear-gradient(160deg,#1a2430,#3a4650 60%,#c8d0d6)}.tbg.dark{background:linear-gradient(#0e1216,#1e262c)}
/* 顶栏 */
#top{position:absolute;left:0;right:0;top:0;height:48px;background:rgba(8,10,12,.86);border-bottom:2px solid #5a4a30;display:flex;align-items:center;gap:20px;padding:0 16px;font-size:18px;z-index:20;white-space:nowrap}
#top .hp{color:#ff7a6a}#top .tmp{color:#9fd4ff;cursor:help}#top .food{color:#ffd38a;cursor:help}#top .fl{color:#c8d0b0}
#top .warn{color:#ff5a4a!important;animation:blink 1.2s infinite}
#top .sp{flex:1}
#top .tb{background:#2e2618;border:1px solid #a88a50;color:#ffe9b8;border-radius:6px;padding:4px 12px;font-size:15px;flex:none}
/* 卡牌：上半插图、中间卡名横幅、下半说明（同旧游戏） */
.card{position:relative;width:150px;height:216px;flex:none;cursor:pointer;transition:transform .12s;border-radius:11px;border:3px solid #6a5a3a;background:linear-gradient(#3a3226,#1a150e);box-shadow:0 4px 12px rgba(0,0,0,.7),inset 0 0 0 2px rgba(0,0,0,.6)}
.card.t-atk{border-color:#9a4a32;background:linear-gradient(#5a3022,#24140c)}
.card.t-skill{border-color:#3e7a5a;background:linear-gradient(#24463a,#0e1c16)}
.card.t-power{border-color:#7a5ab0;background:linear-gradient(#3e2c60,#160f28)}
.card .art{position:absolute;left:9px;right:9px;top:10px;height:92px;border-radius:6px 6px 2px 2px;overflow:hidden;background:radial-gradient(circle at 50% 45%,#5a5040,#1a1610);display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.6)}
.card.s-狙 .art{background:radial-gradient(circle at 50% 45%,#3e5a78,#101820)}.card.s-冲 .art{background:radial-gradient(circle at 50% 45%,#7a4e2a,#20140a)}.card.s-手 .art{background:radial-gradient(circle at 50% 45%,#6a6448,#1c1a10)}
.card .art img{width:100%;height:100%;object-fit:contain}
.card .art .ph{font-size:24px;font-weight:bold;color:rgba(255,240,210,.55);letter-spacing:2px;text-shadow:0 2px 4px #000}
.card .cost{position:absolute;left:-10px;top:-10px;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffc070,#c84e0e 70%);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:21px;color:#fff;text-shadow:0 1px 2px #000;border:2px solid #2a1a08;z-index:4}
.card .cname{position:absolute;left:4px;right:4px;top:102px;height:28px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:bold;color:#3a2410;white-space:nowrap;overflow:hidden;background:linear-gradient(#f0dcb0,#c8a870);border-radius:4px;box-shadow:0 2px 3px rgba(0,0,0,.6);z-index:3}
.card.up .cname{color:#1d6b1d}
.card .ctype{position:absolute;left:6px;right:6px;top:132px;text-align:center;font-size:10.5px;color:#c8b890;opacity:.9}
.card .cdesc{position:absolute;left:8px;right:8px;top:146px;bottom:7px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;line-height:1.3;color:#f4ecd8}
.card .cbadge{position:absolute;left:12px;right:12px;top:76px;text-align:center;font-size:12px;font-weight:bold;background:rgba(40,40,40,.92);color:#ddd;border-radius:5px;padding:2px 0;z-index:3}
.card .cbadge.bayo{background:#a8321e;color:#fff}
.card.bayo{border-color:#ff6a3a;box-shadow:0 0 14px #ff6a3a99}
.kw{color:#ffd35a;border-bottom:1px dotted #ffd35a}
.card b.dup{color:#7dff7d}.card b.ddn{color:#ff7a6a}
.card .sch{font-style:normal;font-weight:bold;padding:0 4px;border-radius:3px;color:#111}.sch.s-狙{background:#9fc8ff}.sch.s-冲{background:#ffaa66}.sch.s-手{background:#d8d0a0}
/* 战斗：人物位置同旧游戏 */
.unit{position:relative;display:flex;flex-direction:column;align-items:center}
.unit .sprw{position:relative}
.unit .spr.blk{display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:bold;color:#fff;text-shadow:0 2px 3px #000;border:3px solid rgba(0,0,0,.55);border-radius:10px;position:relative;z-index:1;padding:4px;text-align:center}
.unit .spr.bossb{border-radius:18px 18px 8px 8px;border-color:#2a0a0a}
.unit .spr.art{display:block;position:relative;z-index:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));transform-origin:50% 100%;-webkit-user-drag:none}
.unit .spr.art.still{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.008,1.018)}}
.unit .shd{position:absolute;left:50%;bottom:-10px;width:110%;height:26px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(0,0,0,.6),transparent);z-index:0}
#hero{position:absolute;left:calc(180px + (var(--sw,1280px) - 1280px) / 4);bottom:232px}
#enemies{position:absolute;right:calc(200px + (var(--sw,1280px) - 1280px) / 4);bottom:232px;display:flex;align-items:flex-end;gap:20px}
.enemy.tg{cursor:crosshair}.enemy.tg .sprw{filter:drop-shadow(0 0 8px #ffd35a)}.enemy.aim .sprw{filter:drop-shadow(0 0 10px #ff5a4a) drop-shadow(0 0 4px #fff)}
.hpw{position:relative;margin-top:8px}
/* 血条、弹仓等挂在脚底下，不把人物往上顶：所有人的脚底都在同一条地平线上 */
.uinfo{position:absolute;top:100%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.unit .bar{width:140px;height:16px;background:#2a0d0d;border:1px solid #000;border-radius:8px;position:relative;overflow:hidden}
.unit .bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e04a3a,#a02018)}
.unit .bar.blk{border:2px solid #6ab0ff}
.unit .bar span{position:absolute;inset:0;font-size:12px;line-height:14px;text-align:center;color:#fff;text-shadow:0 1px 1px #000;font-weight:bold}
.blkv{position:absolute;left:-18px;top:50%;margin-top:-15px;width:30px;height:30px;background:#3a70c0;border:2px solid #cde;border-radius:50% 50% 45% 45%;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:2;color:#fff;font-style:normal}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:240px;margin-top:4px;min-height:20px}
.badges b{font-size:12px;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.65);border:1px solid #888;font-weight:normal;cursor:help}
.badges b.mark{color:#ffd35a;border-color:#ffd35a;font-weight:bold;font-size:14px}.badges b.arm{color:#a8c8e8;border-color:#a8c8e8}.badges b.pw{color:#c8a8ff;border-color:#8a6ab8}.badges b.feelc{color:#ffaa66;border-color:#ff8a3a}
.ammo{display:flex;align-items:center;gap:6px;margin-top:5px;padding:3px 8px;background:rgba(10,10,10,.7);border:1px solid #8a7040;border-radius:6px;cursor:help}
.ammo .pips{display:flex;gap:2px}.ammo .pips i{width:8px;height:17px;border-radius:3px 3px 1px 1px;background:#333;border:1px solid #555}.ammo .pips i.f{background:linear-gradient(#ffe08a,#c8901e);border-color:#ffd35a}
.ammo .mbar{width:120px;height:10px;background:#333;border-radius:4px;overflow:hidden;display:block}.ammo .mbar u{display:block;height:100%;background:#d8a030}
.ammo b{font-size:14px;color:#fff}.ammo.zero{border-color:#ff5a4a;animation:blink 1s infinite}.ammo.zero b{color:#ff6a5a}
.uname{display:none}
.intent{height:34px;font-size:22px;font-weight:bold;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;margin-bottom:6px}
.intent .ii{font-style:normal;margin-right:3px}.intent small{font-size:13px;color:#ffe9b8;margin-left:4px}
.inc{font-size:12px;margin-top:3px;padding:1px 8px;border-radius:4px;background:rgba(0,0,0,.6)}.inc.low{color:#ff8a7a}.inc.ok{color:#8aff9a}
/* 代码动作（叠加在逐帧动画上） */
.sprw.lunge{animation:lunge .38s ease-out}@keyframes lunge{40%{translate:-46px 0}}
.sprw.recoil{animation:recoil .16s ease-out}@keyframes recoil{30%{translate:-9px 0;rotate:-1.5deg}}
.sprw.dash{animation:dash .42s ease-out}@keyframes dash{35%{translate:90px 0}}
.sprw.hitf{animation:hitf .3s}@keyframes hitf{0%,100%{translate:0;filter:none}25%{translate:-8px 0;filter:brightness(1.8) sepia(.6) hue-rotate(-30deg)}70%{translate:5px 0}}
.sprw.hitbig{animation:hitbig .45s}@keyframes hitbig{0%{filter:brightness(3)}18%{translate:0;filter:brightness(3)}30%{translate:-16px 0;filter:brightness(1.6) sepia(.7) hue-rotate(-30deg)}60%{translate:8px 0}100%{translate:0;filter:none}}
.unit.dead.noanim .sprw{animation:fall .7s forwards}@keyframes fall{to{opacity:0;filter:grayscale(1) brightness(.6);rotate:-6deg;translate:10px 14px}}
.unit.dead .sprw{animation:fade .6s .9s forwards}@keyframes fade{to{opacity:0;filter:grayscale(1)}}
.unit.dead .hpw,.unit.dead .badges,.unit.dead .intent{opacity:0;transition:opacity .3s}
#energy{position:absolute;left:26px;bottom:140px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffcf6a,#c8641a 65%,#5a2a08);border:4px solid #2a1a08;box-shadow:0 0 0 3px #8a6a3a,0 4px 10px #000;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold;color:#fff;text-shadow:0 2px 3px #000;z-index:10}
#energy.empty{background:radial-gradient(circle at 40% 35%,#777,#333 70%)}
.pile{position:absolute;bottom:14px;width:92px;height:64px;background:rgba(10,10,10,.75);border:2px solid #6a5a3a;border-radius:8px;cursor:pointer;font-size:13px;color:#c8b890;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.pile b{font-size:22px;color:#fff}
#drawp{left:30px}#discp{right:24px}#exhp{right:126px}
#endturn{position:absolute;right:22px;bottom:150px;width:200px;height:62px;font-size:20px;font-weight:bold;z-index:10;background:linear-gradient(#6a8a3a,#3a5a1c);border-color:#b8d88a}#endturn small{font-size:12px;opacity:.7}
#endturn:disabled{background:#3a3a3a}
.btn.reload{position:absolute;right:22px;bottom:222px;width:200px;height:48px;font-size:18px;padding:4px;z-index:10}.btn.reload small{font-size:12px;opacity:.75}
.btn.reload.hot{background:linear-gradient(#8a6a2a,#5a4218);border-color:#ffd35a}.btn.reload.urgent{animation:pulse2 1s infinite}@keyframes pulse2{50%{box-shadow:0 0 18px #ffd35a}}
/* 手牌（同旧游戏：只露上半，悬停升起） */
#hand{position:absolute;left:150px;right:150px;bottom:0;height:260px;pointer-events:none;z-index:15}
#hand .card{position:absolute;bottom:-78px;pointer-events:auto;touch-action:none}
#hand .card *{pointer-events:none}
#hand .card.off{filter:brightness(.65) saturate(.6)}
#hand .card.sel{box-shadow:0 0 22px 6px #ffd35a}
.notouch #hand .card:not(.dragging):hover{z-index:50!important;transform:translateY(-100px) scale(1.12) rotate(0deg)!important}
#hand .card.dragging,#hand .card.dragging:hover{transition:none!important;z-index:80!important;transform:var(--dt)!important}
#hand .card.ready{filter:drop-shadow(0 0 14px #ffd35a)}
#kwbox{position:absolute;background:rgba(14,12,8,.95);border:2px solid #c9a35a;border-radius:10px;padding:8px 12px;z-index:70;pointer-events:none}
#kwbox p{font-size:13px;line-height:1.45;color:#e8dcc0;margin:3px 0}#kwbox b{color:#ffd35a;margin-right:6px}#kwbox .hint{color:#8aff9a;font-weight:bold;margin-top:6px}#kwbox .hint.bad{color:#ff8a7a}
#tip{position:absolute;left:50%;top:120px;transform:translateX(-50%);background:rgba(0,0,0,.8);padding:8px 20px;border-radius:8px;font-size:20px;color:#ffd35a;pointer-events:none;z-index:120}#tip.stay{top:64px;font-size:17px}
#stage .say{position:absolute;left:50%;top:150px;transform:translateX(-50%);max-width:820px;padding:12px 24px;background:rgba(14,10,8,.9);border:2px solid #c9a35a;border-radius:12px;color:#ffe9c8;font-size:22px;line-height:1.5;text-align:center;z-index:70;pointer-events:none;white-space:pre-line}
#banner{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:46px;font-weight:bold;color:#ffe9b8;text-shadow:0 3px 8px #000;pointer-events:none;animation:ban 1.2s forwards;z-index:70}
@keyframes ban{0%{opacity:0;transform:scale(.8)}20%,70%{opacity:1;transform:scale(1)}100%{opacity:0}}
/* 打击感特效 */
.fxn{position:absolute;font-size:44px;font-weight:bold;pointer-events:none;text-shadow:0 2px 3px #000,0 0 2px #000;animation:fxn 1.1s both;z-index:60;transform:translateX(-50%);white-space:nowrap}
.fxn.dmg{color:#fff}.fxn.crit{color:#ffe14a;font-size:64px;animation:fxc 1.2s both}.fxn.blk{color:#8cf}.fxn.heal{color:#7f7}.fxn.st{color:#ffd35a;font-size:21px}
@keyframes fxn{0%{opacity:0;transform:translate(-50%,0) scale(1.4)}10%{opacity:1;transform:translate(-50%,0) scale(1)}100%{transform:translate(-50%,-70px);opacity:0}}
@keyframes fxc{0%{opacity:0;transform:translate(-50%,0) scale(2)}12%{opacity:1;transform:translate(-50%,0) scale(1)}100%{transform:translate(-50%,-80px);opacity:0}}
.spark{position:absolute;width:7px;height:7px;background:#ffd35a;box-shadow:0 0 6px #ffb020;pointer-events:none;z-index:59;animation:spark .55s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
.bullet{position:absolute;width:30px;height:5px;margin:-2px 0 0 -15px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff6c0,#ffc040);box-shadow:0 0 10px #ffc040;pointer-events:none;z-index:61;animation:bul .11s linear both}
@keyframes bul{0%{opacity:1;transform:translate(0,0)}100%{opacity:1;transform:translate(var(--dx),var(--dy))}}
.muzzle{position:absolute;width:70px;height:46px;margin:-23px 0 0 -10px;pointer-events:none;z-index:62;background:radial-gradient(ellipse at 20% 50%,#fff 0,#ffe27a 25%,rgba(255,140,30,.7) 50%,transparent 72%);animation:muz .11s ease-out forwards}
@keyframes muz{0%{opacity:1;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.2)}}
.casing{position:absolute;width:5px;height:11px;background:linear-gradient(#ffe08a,#b8801a);border-radius:1px;pointer-events:none;z-index:61;animation:casing .6s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes casing{0%{transform:translate(0,0) rotate(0)}40%{transform:translate(calc(var(--dx)*.6),-46px) rotate(calc(var(--r)*.5))}100%{transform:translate(var(--dx),40px) rotate(var(--r));opacity:0}}
.impact{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;pointer-events:none;z-index:62;background:radial-gradient(circle,#fff 0,rgba(255,240,180,.8) 30%,transparent 70%);animation:imp .22s ease-out forwards}
.impact.big{width:90px;height:90px;margin:-45px 0 0 -45px}
@keyframes imp{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.6);opacity:0}}
.shake{animation:shake .28s}@keyframes shake{20%{translate:-8px 4px}40%{translate:7px -5px}60%{translate:-5px 3px}80%{translate:4px -2px}}
.shake2{animation:shake2 .34s}@keyframes shake2{0%{translate:0 0}15%{translate:-14px 6px}30%{translate:12px -8px}50%{translate:-8px 5px}70%{translate:5px -3px}100%{translate:0 0}}
.blink{animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.45}}
/* 面板 */
.panel{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);background:rgba(16,14,10,.94);border:3px solid #a88a50;border-radius:14px;padding:24px 34px;text-align:center;min-width:440px;max-width:1100px;z-index:25}
.panel h2{font-size:30px;margin-bottom:12px;color:#ffe9b8}
.panel p{font-size:18px;line-height:1.6;margin-bottom:10px}
.panel.small{min-width:360px;max-width:520px}.panel.evp{width:760px}.panel.evp p{text-align:left}
.panel.rules{width:900px;text-align:left}.panel.rules p{font-size:16px;margin-bottom:4px}.panel.rules h2,.panel.rules .btn{display:block;margin:10px auto 0;text-align:center}
.sub{color:#c8b890;font-size:15px!important}
.row{display:flex;gap:22px;justify-content:center;align-items:flex-start;flex-wrap:wrap;margin:10px 0 18px}
.col{display:flex;flex-direction:column;gap:10px;align-items:stretch;margin-top:8px}
.btn.opt{text-align:left;font-size:17px}
.overlay{position:absolute;inset:0;background:rgba(6,6,4,.92);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.overlay h2{font-size:28px;color:#ffe9b8}.overlay .panel{position:relative;left:auto;top:auto;transform:none}
.grid{display:flex;flex-wrap:wrap;gap:22px 16px;justify-content:center;max-width:1180px;max-height:540px;overflow:auto;padding:14px 14px 24px}
.grid .card:hover,.row .card:hover{transform:translateY(-8px) scale(1.04)}
.wcard{display:inline-block;width:320px;padding:14px;margin:6px auto 10px;background:#2a2a24;border:3px solid #c9a35a;border-radius:10px}
.wcard b{font-size:24px;color:#ffd35a;display:block}.wcard small{color:#a89a7a}.wcard p{font-size:16px!important;margin:8px 0 0!important}
/* 地图 */
#map{position:absolute;left:0;right:0;top:48px;bottom:0;overflow-y:auto;background:#1e252c}
#mapin{position:relative;width:1000px;margin:0 auto;background:linear-gradient(#d8dee2,#b8c2ca);border-left:6px solid #8a96a0;border-right:6px solid #8a96a0}
#map svg{position:absolute;left:0;top:0}
.node{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:bold;color:#fff;border:3px solid #1a1a1a;text-shadow:0 1px 2px #000}
.node.done{opacity:.4}.node.cur{box-shadow:0 0 0 4px #ffd35a}
.node.av{cursor:pointer;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.15);box-shadow:0 0 14px #ffd35a}}
.node.boss{width:150px;height:110px;margin:-55px 0 0 -75px;border-radius:16px;background:#4a1414;font-size:24px}
#legend{position:absolute;right:20px;top:70px;background:rgba(0,0,0,.65);padding:10px 14px;border-radius:8px;font-size:15px;line-height:2.1}
#legend b{display:inline-block;width:26px;height:26px;border-radius:50%;text-align:center;line-height:24px;margin-right:8px;color:#fff;border:2px solid #111;font-size:14px}#legend .lg2{font-size:13px;color:#c8d0b0;line-height:1.5;margin-top:4px}
/* 标题/剧情/结局 */
.tlogo{position:absolute;left:70px;top:120px}
.tlogo h1{font-size:76px;margin:0;color:#f0e2c0;letter-spacing:8px;text-shadow:0 4px 0 #5a1a10,0 0 18px rgba(0,0,0,.8)}
.tlogo .en{font-size:26px;letter-spacing:10px;color:#d8c8a0;margin-top:4px}.tlogo .en2{font-size:18px;letter-spacing:4px;color:#c8d0d6;margin-top:10px}
.mmenu{position:absolute;right:60px;top:55%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;width:280px}
.btn.mm{font-size:22px;padding:10px 0;width:100%;display:flex;flex-direction:column;align-items:center;background:rgba(30,26,18,.9)}.btn.mm small{font-size:13px;opacity:.8}.btn.mm.sm2{font-size:17px;padding:6px 0}
.tnote{position:absolute;left:70px;bottom:30px;font-size:13px;color:#8a949c}
.storybox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,86%);padding:28px 36px;background:rgba(10,10,10,.6);border-left:4px solid #c9a35a;color:#f0e6d0;font-size:28px;line-height:1.7}
.storybox p{min-height:110px;margin-bottom:16px}.storybox .btn{margin-right:12px}
.endw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:14px;width:760px}
.ribbon{font-size:46px;padding:8px 100px;background:linear-gradient(#cfc4a8,#a89a7a);color:#2a1a08;border-radius:8px;letter-spacing:12px}.ribbon.win{background:linear-gradient(#ffe08a,#d8a030)}
.endsub{font-size:20px;line-height:1.6;text-align:center;color:#e8dcc0}.endsub.small{font-size:16px;color:#a8a090}
.score{width:460px;font-size:19px;border-collapse:collapse}.score td{padding:5px 4px}.score td:last-child{text-align:right;color:#ffd35a}
#dbg{position:absolute;left:300px;top:54px;z-index:35;display:flex;flex-wrap:wrap;gap:4px;max-width:520px}
#dbg button{font-size:12px;padding:4px 8px;background:#111;color:#0f0;border:1px solid #0f0;border-radius:4px;opacity:.8}
#rot{display:none;position:fixed;inset:0;z-index:999;background:#0e1014;color:#ffe9b8;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:22px;text-align:center}
#rot .ph{width:70px;height:120px;border:5px solid #ffd35a;border-radius:12px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
/* ===== 手机（触屏）：同旧游戏的放大方式 ===== */
.touch #top{height:58px;font-size:23px;gap:16px}.touch #top .tb{font-size:20px;min-height:44px;padding:4px 14px}
.touch #map{top:58px}
.touch #hand{left:0;right:0;zoom:1.45;height:240px}.touch #hand .card{bottom:-40px}
.touch #hand .card.peek{z-index:60!important;transform:translateY(-120px) scale(1.3) rotate(0deg)!important}
.touch #energy{zoom:1.15;bottom:150px;left:10px}
.touch #endturn{bottom:175px;width:250px;height:84px;font-size:26px}
.touch .btn.reload{bottom:268px;width:250px;height:64px;font-size:24px}
.touch .pile{zoom:1.15}
.touch #hero .uinfo{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 6px;width:440px}.touch #hero .hpw{flex-basis:100%;display:flex;justify-content:center}.touch #hero .uinfo .badges,.touch #hero .uinfo .ammo,.touch #hero .uinfo .inc{margin-top:4px;min-height:0}
.touch #hero{bottom:330px}.touch #enemies{bottom:330px;gap:0}.touch .bg.battle{background-position:center 88%}
.touch .intent{font-size:30px;height:42px;margin-bottom:-4px}.touch .intent small{font-size:18px}
.touch .unit .bar{width:170px;height:24px;border-radius:12px}.touch .unit .bar span{font-size:18px;line-height:22px}
.touch .blkv{width:38px;height:38px;margin-top:-19px;left:-24px;font-size:18px}
.touch .badges{max-width:300px}.touch .badges b{font-size:17px;padding:2px 7px}.touch .badges b.mark{font-size:19px}.touch .inc{font-size:17px}
.touch .ammo .pips i{width:11px;height:22px}.touch .ammo b{font-size:19px}
.touch #kwbox p{font-size:19px}
.touch .btn{min-height:54px;font-size:21px}.touch .btn.opt{min-height:62px}
.touch .panel{zoom:1.25}.touch .overlay .grid{zoom:1.2}
.touch .node{transform:scale(1.25)}.touch #legend{zoom:1.35}
.touch .mmenu{zoom:1.3;right:40px}.touch .tlogo{zoom:1.2;left:50px}
.touch .storybox{font-size:34px}.touch .endw{zoom:1.2}
.touch #dbg{top:62px;left:420px}.touch #dbg button{font-size:16px;padding:6px 10px}
.touch #stage .say{font-size:28px;max-width:1100px}.touch #tip{font-size:28px}
.touch .fxn{font-size:150%}
</style>
</head>
<body>
<div id="rot"><div class="ph"></div><div>请把手机横过来玩</div></div>
<div id="stage"><div id="view"></div><div id="fx"></div></div>
<script>document.documentElement.classList.toggle('notouch', !matchMedia('(hover: none), (pointer: coarse)').matches)</script>
<script type="module" src="src/game.js"></script>
</body>
</html>
