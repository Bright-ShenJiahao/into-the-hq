name: 机器人强化训练
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '每个角色训练分钟数（大于 0，最多 180；默认 55）'
        type: number
        default: 55
        required: true
permissions:
  contents: write
concurrency:
  group: bot-preview-reports
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  train:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        char: [hansong, chenmo, tian, zhao, shen]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 训练并用同一批 1000 局比较三组权重
        env:
          BOT_CHAR: ${{ matrix.char }}
          MINUTES: ${{ inputs.minutes }}
        shell: bash
        run: |
          set -euo pipefail
          export BOT_SOURCE_SHA="$(git rev-parse HEAD)"
          node tools/bot/train.mjs "$BOT_CHAR" "$MINUTES" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bot-train-${{ matrix.char }}
          path: data/bot_train_${{ matrix.char }}.json
          if-no-files-found: error
  save:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bot-train-*
          path: parts
          merge-multiple: true
      - name: 合并权重与中文训练报告，提交 preview
        shell: bash
        run: |
          set -euo pipefail
          node tools/bot/report.mjs train parts >> "$GITHUB_STEP_SUMMARY"
          git config user.name "bot-train"
          git config user.email "bot@users.noreply.github.com"
          git add tools/bot/weights.json data/bot_train.md data/bot_train_*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "机器人强化训练：更新权重与报告 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin preview
            if git push origin HEAD:preview; then exit 0; fi
          done
          exit 1
