name: 机器人平衡测试
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bot-preview-reports
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  balance:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        char: [hansong, chenmo, tian, zhao, shen]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 使用训练权重运行 300 局
        env:
          BOT_CHAR: ${{ matrix.char }}
          SEED: '2000001'
        shell: bash
        run: |
          set -euo pipefail
          export BOT_SOURCE_SHA="$(git rev-parse HEAD)"
          node tools/bot/sim.mjs 300 "$BOT_CHAR"
      - name: 上传结果（程序报错也保留上下文）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-balance-${{ matrix.char }}
          path: data/bot_balance_${{ matrix.char }}.json
          if-no-files-found: error
  save:
    needs: balance
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: bot-balance-*
          path: parts
          merge-multiple: true
      - name: 汇总中文报告，提交 preview
        shell: bash
        run: |
          set -euo pipefail
          node tools/bot/report.mjs balance parts >> "$GITHUB_STEP_SUMMARY"
          git config user.name "bot-balance"
          git config user.email "bot@users.noreply.github.com"
          git add data/bot_balance.md data/bot_balance_*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "机器人平衡测试结果 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin preview
            if git push origin HEAD:preview; then exit 0; fi
          done
          exit 1
